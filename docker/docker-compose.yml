services:
  picobot-minimax:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: picobot-minimax
    restart: unless-stopped
    labels:
      - "picobot.model=minimax/minimax-m2.5"
      - "picobot.telegram=@fdd_venkalth_pickerin_bot"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-or-v1-REPLACE_ME}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://openrouter.ai/api/v1}
      - PICOBOT_MODEL=minimax/minimax-m2.5
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_ALLOW_FROM=${DISCORD_ALLOW_FROM:-}
    group_add:
      - "970"
    volumes:
      - ./picobot-data-minimax:/home/picobot/.picobot
      - ${HOME}/.picobot/mcp.json:/home/picobot/.picobot/mcp.json:ro
      - /var/run/docker.sock:/var/run/docker.sock

  picobot-qwen:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: picobot-qwen
    restart: unless-stopped
    labels:
      - "picobot.model=qwen/qwen3-next-80b"
      - "picobot.telegram=@fdd_shadow_morelli_bot"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-or-v1-REPLACE_ME}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://openrouter.ai/api/v1}
      - PICOBOT_MODEL=qwen/qwen3-next-80b
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_TWO:-}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_ALLOW_FROM=${DISCORD_ALLOW_FROM:-}
    group_add:
      - "970"
    volumes:
      - ./picobot-data-qwen:/home/picobot/.picobot
      - ${HOME}/.picobot/mcp.json:/home/picobot/.picobot/mcp.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
