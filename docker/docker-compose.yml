services:
  picobot-shadow-morelli-qwen3.5-9b:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: picobot-shadow-morelli-qwen3.5-9b
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-lm-studio}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://10.10.0.112:1234/v1}
      - PICOBOT_MODEL=${PICOBOT_MODEL:-qwen/qwen3.5-9b}
      - PICOBOT_MAX_TOKENS=${PICOBOT_MAX_TOKENS:-8192}
      - PICOBOT_MAX_TOOL_ITERATIONS=${PICOBOT_MAX_TOOL_ITERATIONS:-100}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_TWO:-}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM:-}
    volumes:
      - ./data-shadow-morelli-qwen3.5-9b:/home/picobot/.picobot